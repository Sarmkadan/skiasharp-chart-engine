name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Matches TargetFramework net10.0 (global.json pins 10.0.100, rollForward latestMinor)
          dotnet-version: '10.0.x'

      # The root folder holds both a .sln/.slnx and a .csproj, so commands must name a project.
      # The .sln only lists the main library, so the test project is referenced directly
      # (it pulls the main project in through ProjectReference).
      - name: Restore dependencies
        run: dotnet restore tests/skiasharp-chart-engine.Tests/skiasharp-chart-engine.Tests.csproj

      - name: Build
        run: dotnet build tests/skiasharp-chart-engine.Tests/skiasharp-chart-engine.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/skiasharp-chart-engine.Tests/skiasharp-chart-engine.Tests.csproj --no-build --configuration Release --verbosity normal
